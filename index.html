<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>容离生日快乐！</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height:100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    overflow:hidden;
    position:relative;
    background: linear-gradient(135deg,#e8f7f3 0%,#e6f0ff 35%,#fdeef3 70%,#eaf7e6 100%);
    background-size:300% 300%;
    animation: bgMove 22s ease-in-out infinite;
  }
  @keyframes bgMove {
    0%,100% { background-position:0% 50%; }
    50%     { background-position:100% 50%; }
  }

  /* 柔光色块 */
  body::before {
    content:"";
    position:fixed; inset:-25%;
    background:
      radial-gradient(circle at 20% 20%, rgba(150,232,214,.55), transparent 45%),
      radial-gradient(circle at 82% 28%, rgba(176,203,255,.55), transparent 45%),
      radial-gradient(circle at 68% 82%, rgba(255,199,221,.5), transparent 45%),
      radial-gradient(circle at 22% 86%, rgba(206,245,196,.5), transparent 45%);
    filter: blur(14px);
    animation: floatBg 26s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes floatBg {
    from { transform: translate3d(-2%,-1%,0) scale(1); }
    to   { transform: translate3d(2%,2%,0) scale(1.1); }
  }

  /* ---------- 花瓣飘落 ---------- */
  .petals { position:fixed; inset:0; pointer-events:none; z-index:1; }
  .petal {
    position:absolute;
    top:-8vh;
    border-radius: 60% 0 60% 0;
    opacity:.75;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform;
  }
  @keyframes fall {
    0%   { transform: translate3d(0,-12vh,0) rotate(0deg); opacity:0; }
    8%   { opacity:.85; }
    88%  { opacity:.85; }
    100% { transform: translate3d(70px, 112vh, 0) rotate(620deg); opacity:0; }
  }

  /* ---------- 卡片 ---------- */
  .card {
    position:relative;
    z-index:2;
    width:min(560px, 100%);
    padding: 46px 34px 40px;
    text-align:center;
    border-radius: 34px;
    background: rgba(255,255,255,.58);
    border: 1.5px solid rgba(255,255,255,.9);
    box-shadow:
      0 22px 55px -18px rgba(90,150,190,.35),
      0 4px 18px rgba(255,255,255,.6) inset;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    animation: cardIn 1s cubic-bezier(.2,.85,.35,1.15) both;
  }
  @keyframes cardIn {
    from { opacity:0; transform: translateY(40px) scale(.94); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }

  /* 卡片上的小圆点装饰 */
  .card::after {
    content:"";
    position:absolute; inset:12px;
    border-radius:26px;
    border:1px dashed rgba(120,200,190,.35);
    pointer-events:none;
  }

  .cake {
    font-size: 54px;
    line-height:1;
    display:inline-block;
    animation: bob 2.8s ease-in-out infinite;
    filter: drop-shadow(0 10px 14px rgba(255,150,180,.35));
  }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50%     { transform: translateY(-12px) rotate(3deg); }
  }

  .title {
    margin-top: 18px;
    font-size: clamp(2rem, 8.5vw, 3.3rem);
    font-weight: 800;
    letter-spacing: .06em;
    line-height: 1.35;
    white-space: nowrap;
  }
  .title span {
    display:inline-block;
    background: linear-gradient(150deg, #37c2ac 0%, #4fa8e8 48%, #8f8ce8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity:0;
    animation: popIn .9s cubic-bezier(.2,.85,.3,1.35) forwards;
    filter: drop-shadow(0 4px 10px rgba(120,190,220,.35));
  }
  @keyframes popIn {
    0%   { opacity:0; transform: translateY(26px) scale(.55) rotate(-12deg); }
    60%  { opacity:1; transform: translateY(-7px) scale(1.12) rotate(4deg); }
    100% { opacity:1; transform: translateY(0) scale(1) rotate(0); }
  }

  .divider {
    width: 88px; height: 3px;
    margin: 20px auto 18px;
    border-radius: 99px;
    background: linear-gradient(90deg, transparent, #7fd8cb, #8fb4f0, transparent);
    opacity:.9;
  }

  .subtitle {
    font-size: 15.5px;
    line-height: 2;
    color: #5b7a86;
    letter-spacing: .04em;
    animation: fadeUp 1.1s ease .9s both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(14px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .btn {
    margin-top: 26px;
    padding: 14px 36px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .06em;
    color:#fff;
    cursor: pointer;
    background: linear-gradient(120deg, #4fd1c5, #5aa9e6 55%, #9b8ce8);
    background-size: 200% 100%;
    box-shadow: 0 12px 26px -6px rgba(90,169,230,.6);
    transition: transform .22s ease, box-shadow .22s ease, background-position .6s ease;
    animation: fadeUp 1.1s ease 1.1s both;
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.045);
    background-position: 100% 0;
    box-shadow: 0 18px 34px -8px rgba(120,150,235,.65);
  }
  .btn:active { transform: translateY(0) scale(.97); }

  .hint {
    margin-top: 14px;
    font-size: 13px;
    color:#8fa9b3;
    letter-spacing: .08em;
    min-height: 1.4em;
    transition: opacity .4s ease;
  }

  #confetti {
    position: fixed;
    inset: 0;
    z-index: 9;
    pointer-events: none;
  }

  @media (max-width: 420px) {
    .card { padding: 38px 20px 32px; border-radius: 28px; }
    .cake { font-size: 46px; }
    .subtitle { font-size: 14px; }
    .btn { padding: 13px 28px; font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

  <!-- 飘落花瓣 -->
  <div class="petals" id="petals"></div>

  <!-- 祝福卡片 -->
  <main class="card">
    <div class="cake">🎂</div>
    <h1 class="title" id="title" aria-label="容离生日快乐！"></h1>
    <div class="divider"></div>
    <p class="subtitle">
      愿你走出过去，做点自己喜欢的事<br>
      每天开开心心，多碰到正常人
    </p>
    <button class="btn" id="btn">点亮祝福 🎉</button>
    <p class="hint" id="hint">轻轻一点，好运开启</p>
  </main>

  <canvas id="confetti"></canvas>

<script>
/* ---------------- 1. 文字逐字弹出 ---------------- */
(function () {
  const text = "容离生日快乐！";
  const title = document.getElementById("title");
  [...text].forEach((ch, i) => {
    const span = document.createElement("span");
    span.textContent = ch;
    span.style.animationDelay = (0.25 + i * 0.13) + "s";
    title.appendChild(span);
  });
})();

/* ---------------- 2. 花瓣飘落 ---------------- */
(function () {
  const colors = ["#a8ecd8", "#b8d4ff", "#ffc9dd", "#ffe9a8", "#d5f5c8", "#e3d5ff"];
  const box = document.getElementById("petals");
  const count = window.innerWidth < 600 ? 16 : 28;

  for (let i = 0; i < count; i++) {
    const p = document.createElement("div");
    p.className = "petal";
    const size = 8 + Math.random() * 12;
    p.style.width = size + "px";
    p.style.height = size * (0.8 + Math.random() * 0.5) + "px";
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[(Math.random() * colors.length) | 0];
    p.style.opacity = 0.45 + Math.random() * 0.4;
    p.style.animationDuration = (11 + Math.random() * 13) + "s";
    p.style.animationDelay = (-Math.random() * 24) + "s";
    box.appendChild(p);
  }
})();

/* ---------------- 3. 彩纸礼花 ---------------- */
(function () {
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  const COLORS = ["#4fd1c5", "#5aa9e6", "#9b8ce8", "#ff9ec4", "#ffd66e", "#8ee6a8", "#ffffff"];
  let particles = [];
  let running = false;

  function burst(originX, originY, amount) {
    for (let i = 0; i < amount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 13;
      particles.push({
        x: originX + (Math.random() - 0.5) * 60,
        y: originY + (Math.random() - 0.5) * 30,
        vx: Math.cos(angle) * speed * (0.6 + Math.random() * 0.7),
        vy: Math.sin(angle) * speed * (0.6 + Math.random() * 0.7) - 6,
        size: 4 + Math.random() * 8,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.32,
        shape: Math.random() < 0.5 ? "rect" : "circle",
        life: 1
      });
    }
    if (!running) {
      running = true;
      requestAnimationFrame(loop);
    }
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 0.34;          // 重力
      p.vx *= 0.992;         // 空气阻力
      p.vy *= 0.992;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;

      if (p.y > H * 0.72) p.life -= 0.014;
      if (p.life <= 0 || p.y > H + 60) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === "rect") {
        ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.62);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    if (particles.length > 0) {
      requestAnimationFrame(loop);
    } else {
      running = false;
      ctx.clearRect(0, 0, W, H);
    }
  }

  /* 按钮点击 */
  const btn = document.getElementById("btn");
  const hint = document.getElementById("hint");
  const messages = [
    "祝福已送达，请查收 💌",
    "愿你每天都像今天一样闪闪发光 ✨",
    "关关难过关关过",
    "好运正在向你飞奔而来 🌿"
  ];
  let idx = 0;

  btn.addEventListener("click", function () {
    const rect = btn.getBoundingClientRect();
    burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 90);

    // 两侧再补两发
    setTimeout(() => burst(W * 0.12, H * 0.82, 45), 180);
    setTimeout(() => burst(W * 0.88, H * 0.82, 45), 320);

    hint.style.opacity = 0;
    setTimeout(() => {
      hint.textContent = messages[idx % messages.length];
      idx++;
      hint.style.opacity = 1;
    }, 260);
  });

  /* 页面加载 1.6 秒后，来一次温柔的开场礼花 */
  window.addEventListener("load", () => {
    setTimeout(() => burst(W / 2, H * 0.42, 55), 1600);
  });
})();
</script>
</body>
</html>
