<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我的博客</title>

<style>
  /* ========================================================
     样式区：想改颜色、字体、间距，基本只改下面这一块变量
     ======================================================== */
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #626a72;
    --line: #e6e6e2;
    --accent: #2f6feb;
    --accent-soft: #eaf1ff;
    --radius: 14px;
    --max: 860px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.14);
  }

  /* 系统深色模式自动切换；不想要可以整段删掉 */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --card: #1c1f23;
      --text: #e9ebee;
      --muted: #9aa3ad;
      --line: #2a2e34;
      --accent: #79a8ff;
      --accent-soft: #1e2a3f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap {
    width: 100%;
    max-width: var(--max);
    margin: 0 auto;
    padding-left: 20px;
    padding-right: 20px;
  }

  /* ---------- 顶部导航 ---------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 60px;
    flex-wrap: wrap;
    padding-top: 8px;
    padding-bottom: 8px;
  }
  .logo {
    font-weight: 700;
    font-size: 17px;
    color: var(--text);
    white-space: nowrap;
  }
  .logo:hover { color: var(--accent); text-decoration: none; }
  .nav { display: flex; gap: 14px; flex-wrap: wrap; }
  .nav a { color: var(--muted); font-size: 14px; }
  .nav a:hover { color: var(--accent); text-decoration: none; }
  .nav a.active { color: var(--accent); font-weight: 600; }

  .search-box input {
    width: 190px;
    padding: 6px 12px;
    font-size: 14px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  @media (max-width: 640px) {
    .search-box input { width: 130px; }
  }

  /* ---------- 主体 ---------- */
  main.wrap { padding-top: 40px; padding-bottom: 72px; min-height: 60vh; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .fade-in { animation: fadeInUp .3s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
  }

  /* 首页大标题 */
  .hero {
    padding: 8px 0 36px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 36px;
  }
  .hero h1 {
    font-size: clamp(26px, 5vw, 38px);
    line-height: 1.3;
    margin: 0 0 10px;
  }
  .lead { color: var(--muted); font-size: 16px; margin: 0; }

  .section-title {
    font-size: 14px;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 0 0 16px;
    font-weight: 600;
  }

  /* 入口卡片（首页那几个大标题） */
  .entry-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
    margin-bottom: 44px;
  }
  .entry-card {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    color: inherit;
    transition: transform .15s ease, border-color .15s ease;
  }
  .entry-card:hover {
    text-decoration: none;
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .entry-emoji { font-size: 24px; line-height: 1.2; }
  .entry-card h3 { margin: 0 0 4px; font-size: 16px; }
  .entry-card p { margin: 0 0 8px; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .entry-count { font-size: 12px; color: var(--accent); }

  /* 内容列表卡片 */
  .list { display: flex; flex-direction: column; gap: 14px; }
  .item-card {
    display: block;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    color: inherit;
    transition: transform .15s ease, border-color .15s ease;
  }
  .item-card:hover {
    text-decoration: none;
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .item-card h3 { margin: 8px 0 6px; font-size: 18px; line-height: 1.5; }
  .item-card p { margin: 0; font-size: 14px; color: var(--muted); }

  .meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--muted);
  }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
  }
  a.badge:hover { text-decoration: none; filter: brightness(.95); }
  .badge-app {
    background: #e6f7ed;
    color: #1a7f45;
  }
  @media (prefers-color-scheme: dark) {
    .badge-app { background: #16301f; color: #6ee7a0; }
  }

  /* 返回链接 */
  .back {
    display: inline-block;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .back:hover { color: var(--accent); text-decoration: none; }

  /* 入口页头部 */
  .page-head { margin-bottom: 30px; }
  .page-head .entry-emoji { font-size: 32px; display: block; }
  .page-head h1 { font-size: clamp(24px, 4vw, 32px); margin: 10px 0 8px; }

  /* ---------- 详情页 ---------- */
  .detail-title {
    font-size: clamp(24px, 4vw, 32px);
    line-height: 1.35;
    margin: 14px 0 26px;
  }

  /* 小工具的外框 */
  .demo-frame {
    margin: 24px 0 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .demo-frame iframe {
    display: block;
    width: 100%;
    height: 460px;
    border: 0;
  }
  .demo-tip {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 28px;
  }

  /* 文章正文排版 */
  .article-body { font-size: 16px; line-height: 1.95; }
  .article-body h2 {
    font-size: 20px;
    margin: 36px 0 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .article-body h3 { font-size: 17px; margin: 26px 0 10px; }
  .article-body p { margin: 0 0 18px; }
  .article-body ul, .article-body ol { margin: 0 0 18px; padding-left: 24px; }
  .article-body li { margin: 6px 0; }
  .article-body blockquote {
    margin: 0 0 20px;
    padding: 12px 18px;
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 10px 10px 0;
    color: var(--muted);
  }
  .article-body blockquote p:last-child { margin-bottom: 0; }
  .article-body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .9em;
    padding: 2px 6px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .article-body pre {
    background: #11151a;
    color: #e6edf3;
    padding: 16px 18px;
    border-radius: 12px;
    overflow-x: auto;
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 22px;
  }
  .article-body pre code {
    background: none;
    color: inherit;
    padding: 0;
    font-size: inherit;
  }

  /* 上一篇 / 下一篇 */
  .post-nav {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: 52px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    font-size: 14px;
  }
  .post-nav a { max-width: 48%; }
  .post-nav .next { margin-left: auto; text-align: right; }

  /* 空状态 / 404 */
  .empty { text-align: center; padding: 60px 0; color: var(--muted); }
  .empty h1 { font-size: 52px; margin: 0 0 8px; color: var(--text); }

  /* 页脚 */
  .site-footer {
    border-top: 1px solid var(--line);
    padding: 26px 0 44px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>

  <!-- 顶部：站点名 + 入口导航（自动生成）+ 搜索框 -->
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="#/">✦ 我的博客</a>
      <nav class="nav" id="nav"></nav>
      <div class="search-box">
        <input id="search" type="search" placeholder="搜索文章和小工具…" autocomplete="off" />
      </div>
    </div>
  </header>

  <!-- 所有页面内容都渲染到这里 -->
  <main class="wrap" id="app"></main>

  <footer class="site-footer">
    <div class="wrap">© <span id="year"></span> 我的博客</div>
  </footer>

<script>
/* ==========================================================
   数据区：日常只改这里
   ----------------------------------------------------------
   ① entries = 首页上的几个“入口”（大标题）
   ② items   = 每个入口下面的具体内容（文章 或 小工具）

   加一个入口：往 entries 里加一行
   加一篇文章：往 items 里加一条，type 写 'article'
   加一个小工具：在 apps/ 文件夹里放一个 HTML，
                然后往 items 里加一条，type 写 'app'，
                demo 写 'apps/你的文件名.html'
   ========================================================== */

const entries = [
  { id: 'projects', name: '小项目',   emoji: '🧪', desc: '能直接在页面里玩的小工具' },
  { id: 'tech',     name: '技术笔记', emoji: '💻', desc: '代码、工具和折腾记录' },
  { id: 'life',     name: '生活随笔', emoji: '☕', desc: '日子里的碎碎念' },
  { id: 'books',    name: '读书笔记', emoji: '📚', desc: '读过的书和划线' },
];

const items = [

  /* ---------- 小项目（type: 'app'） ---------- */
  {
    slug: 'calculator',
    entry: 'projects',
    type: 'app',
    demo: 'apps/calculator.html',
    demoHeight: 480,
    title: '一个极简计算器',
    date: '2025-03-01',
    summary: '支持键盘输入的四则运算器，纯前端实现。',
    content: '<p>这是我练手的第一个小工具，用来熟悉页面事件和状态变化。</p>'
  },

  /* ---------- 技术笔记（type: 'article'） ---------- */
  {
    slug: 'build-blog',
    entry: 'tech',
    type: 'article',
    title: '用纯 HTML 搭一个博客',
    date: '2025-02-18',
    summary: '不装框架、不配工具，一个文件也能有“点进去”的页面切换。',
    content: `
      <p>一直想有个自己的小站。不用复杂，打开能看东西，能分门别类就行。</p>

      <h2>地址栏里的 # 是干什么的</h2>
      <p>地址栏里 <code>#</code> 后面的内容变化时，页面不会刷新，但浏览器会通知脚本。我们只要监听这个变化，决定显示哪一块内容，就有了“多页面”的感觉。</p>
      <pre><code>window.addEventListener('hashchange', router);</code></pre>

      <h2>内容不要写死在页面里</h2>
      <p>文章整理成一个清单，页面按清单自动生成。加一篇新文章，只要往清单里加一条。</p>
      <blockquote>
        <p>结构是死的，内容是活的。内容抽出来之后，写博客就只剩“写字”这一件事。</p>
      </blockquote>
    `
  },
  {
    slug: 'css-variables',
    entry: 'tech',
    type: 'article',
    title: '聊聊 CSS 变量',
    date: '2025-01-05',
    summary: '让“改颜色”从一件苦差事，变成改一行代码。',
    content: `
      <p>CSS 变量是我用得最多的特性之一，原因很简单：它让换主题变得很轻。</p>

      <h2>基本用法</h2>
      <pre><code>:root {
  --accent: #2f6feb;
}

.button {
  background: var(--accent);
}</code></pre>

      <h2>暗色主题</h2>
      <p>配合系统的深色模式，覆盖一下变量就行，组件本身一行都不用改。你现在看到的这个页面就是这么做的。</p>
    `
  },

  /* ---------- 生活随笔 ---------- */
  {
    slug: 'first-week',
    entry: 'life',
    type: 'article',
    title: '搬到新城市的第一周',
    date: '2025-02-10',
    summary: '两个行李箱，三个纸箱，和一条慢慢熟悉的街。',
    content: `
      <p>上周搬到了新的城市。行李箱两个，纸箱三个，剩下的东西都还在路上。</p>
      <p>第一晚房间是空的，只有一张床垫和一盏灯。坐在地板上吃便利店的饭团，突然觉得挺自由。</p>

      <h2>慢慢认识一条街</h2>
      <p>第二天开始出门乱走。楼下的早餐店、转角的咖啡、两条街外的菜市场，一条街一条街地记。认识一座城市大概和认识一个人差不多，都是从细节开始的。</p>
    `
  },
  {
    slug: 'getting-up-early',
    entry: 'life',
    type: 'article',
    title: '早起这件小事',
    date: '2025-01-20',
    summary: '不是五点半起床的自律故事，只是把闹钟往前挪了一格。',
    content: `
      <p>试着早起一个月了。不是那种五点半起床的自律故事，只是把闹钟从八点挪到了七点。</p>

      <h2>后来做的事</h2>
      <ul>
        <li>把手机放在客厅充电，闹钟放在床头；</li>
        <li>晚上十一点关掉大灯，只留一盏小台灯；</li>
        <li>起床后立刻喝一杯水，然后拉开窗帘。</li>
      </ul>
      <p>没有什么神奇的转折，就是慢慢地，七点醒变得不再痛苦。</p>
    `
  },

  /* ---------- 读书笔记 ---------- */
  {
    slug: 'little-prince',
    entry: 'books',
    type: 'article',
    title: '重读《小王子》',
    date: '2025-02-02',
    summary: '小时候读觉得是童话，现在读觉得是写给大人的书。',
    content: `
      <p>重读《小王子》。小时候读觉得是童话，现在读觉得是一本写给大人的书。</p>
      <blockquote>
        <p>“真正重要的东西，用眼睛是看不见的。”</p>
      </blockquote>
      <p>这句话被引用得太多了，多到有点廉价。但放回整本书里，它前面还有很长一段铺垫：狐狸、麦田、驯养，以及等待。</p>

      <h2>这次注意到的地方</h2>
      <p>是那个点灯人。以前觉得他可笑，现在觉得他认真得让人心酸。规则和职责，有时候就是一个人全部的秩序。</p>
    `
  },
  {
    slug: 'hackers-painters',
    entry: 'books',
    type: 'article',
    title: '读《黑客与画家》',
    date: '2025-01-15',
    summary: '一本讲编程的书，但更像一本讲创造的书。',
    content: `
      <p>《黑客与画家》是一本讲编程的书，但更像一本讲创造的书。</p>

      <h2>印象最深的两点</h2>
      <ul>
        <li>编程是表达，和画画一样，草稿要反复修改；</li>
        <li>好的设计是简单的，复杂往往意味着还没想清楚。</li>
      </ul>
      <p>书里有些观点放到今天可能不完全成立，但“动手做点东西”的劲头是能传染的。</p>
    `
  }
];

/* ==========================================================
   工具函数
   ========================================================== */

const $app = document.getElementById('app');
const $nav = document.getElementById('nav');
const $search = document.getElementById('search');
let searching = false;

function entryById(id) {
  return entries.find(e => e.id === id);
}

function sortedItems() {
  return [...items].sort((a, b) => b.date.localeCompare(a.date));
}

function itemsOfEntry(id) {
  return sortedItems().filter(it => it.entry === id);
}

function formatDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${y} 年 ${Number(m)} 月 ${Number(d)} 日`;
}

function readingTime(html) {
  const text = (html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, '');
  return Math.max(1, Math.round(text.length / 350));
}

function setTitle(text) {
  document.title = text ? text + ' · 我的博客' : '我的博客 · 随笔与笔记';
}

function stripHtml(html) {
  return (html || '')
    .replace(/<[^>]*>/g, ' ')
    .replace(/\s+/g, ' ')
    .toLowerCase();
}

/* ==========================================================
   渲染函数
   ========================================================== */

function renderNav(activeId) {
  $nav.innerHTML = entries.map(e => {
    const active = e.id === activeId ? ' class="active"' : '';
    return `<a href="#/e/${e.id}"${active}>${e.name}</a>`;
  }).join('');
}

function itemCard(it) {
  const e = entryById(it.entry);
  const typeBadge = it.type === 'app'
    ? '<span class="badge badge-app">可运行</span>'
    : '';
  const time = it.type === 'article'
    ? `<span>· 约 ${readingTime(it.content)} 分钟</span>`
    : '';
  return `
    <a class="item-card" href="#/p/${it.slug}">
      <div class="meta">
        <span class="badge">${e ? e.name : '未分类'}</span>
        ${typeBadge}
        <span>${formatDate(it.date)}</span>
        ${time}
      </div>
      <h3>${it.title}</h3>
      <p>${it.summary}</p>
    </a>
  `;
}

function renderHome() {
  setTitle('');

  const entryCards = entries.map(e => `
    <a class="entry-card" href="#/e/${e.id}">
      <div class="entry-emoji">${e.emoji}</div>
      <div>
        <h3>${e.name}</h3>
        <p>${e.desc}</p>
        <span class="entry-count">${itemsOfEntry(e.id).length} 条内容</span>
      </div>
    </a>
  `).join('');

  const list = sortedItems().map(itemCard).join('');

  $app.innerHTML = `
    <section class="hero">
      <h1>你好，我是 <span style="color:var(--accent)">你的名字</span> 👋</h1>
      <p class="lead">这里放我写过的文章，和几个能直接玩的小工具。共 ${items.length} 条内容。</p>
    </section>

    <section>
      <h2 class="section-title">入口</h2>
      <div class="entry-grid">${entryCards}</div>
    </section>

    <section>
      <h2 class="section-title">全部内容</h2>
      <div class="list">${list}</div>
    </section>
  `;
}

function renderEntry(id) {
  const e = entryById(id);
  if (!e) return renderNotFound();

  setTitle(e.name);

  const list = itemsOfEntry(id).map(itemCard).join('') ||
               `<p class="lead">这个入口下还没有内容。</p>`;

  $app.innerHTML = `
    <a class="back" href="#/">← 返回首页</a>
    <header class="page-head">
      <span class="entry-emoji">${e.emoji}</span>
      <h1>${e.name}</h1>
      <p class="lead">${e.desc}</p>
    </header>
    <div class="list">${list}</div>
  `;
}

function renderDetail(slug) {
  const it = items.find(x => x.slug === slug);
  if (!it) return renderNotFound();

  setTitle(it.title);

  const e = entryById(it.entry);
  const all = sortedItems();
  const idx = all.findIndex(x => x.slug === slug);
  const newer = all[idx - 1];
  const older = all[idx + 1];

  const demoBlock = it.type === 'app' && it.demo
    ? `<div class="demo-frame">
         <iframe src="${it.demo}" title="${it.title}"
                 loading="lazy"
                 style="height:${it.demoHeight || 460}px"></iframe>
       </div>
       <p class="demo-tip">
         <a href="${it.demo}" target="_blank" rel="noopener">在新标签页打开 ↗</a>
       </p>`
    : '';

  const body = it.type === 'article'
    ? `<div class="article-body">${it.content || ''}</div>`
    : `<div class="article-body">${it.content || ''}</div>`;

  $app.innerHTML = `
    <a class="back" href="#/">← 返回首页</a>

    <article>
      <div class="meta">
        ${e ? `<a class="badge" href="#/e/${e.id}">${e.name}</a>` : ''}
        ${it.type === 'app' ? '<span class="badge badge-app">可运行</span>' : ''}
        <span>${formatDate(it.date)}</span>
        ${it.type === 'article'
          ? `<span>· 约 ${readingTime(it.content)} 分钟</span>`
          : ''}
      </div>
      <h1 class="detail-title">${it.title}</h1>

      ${demoBlock}
      ${body}
    </article>

    <nav class="post-nav">
      ${older
        ? `<a href="#/p/${older.slug}">← 上一篇：${older.title}</a>`
        : '<span></span>'}
      ${newer
        ? `<a class="next" href="#/p/${newer.slug}">下一篇：${newer.title} →</a>`
        : '<span></span>'}
    </nav>
  `;
}

function renderNotFound() {
  setTitle('页面不存在');
  $app.innerHTML = `
    <div class="empty">
      <h1>404</h1>
      <p>没有找到这个页面，它可能已经被移动或删除了。</p>
      <p><a href="#/">← 回到首页</a></p>
    </div>
  `;
}

/* ---------- 本地搜索 ---------- */

function searchItems(q) {
  const kw = q.trim().toLowerCase();
  if (!kw) return [];
  return items.filter(it => {
    const hitTitle   = it.title.toLowerCase().includes(kw);
    const hitSummary = (it.summary || '').toLowerCase().includes(kw);
    const hitContent = stripHtml(it.content).includes(kw);
    return hitTitle || hitSummary || hitContent;
  });
}

function renderSearch(q) {
  searching = true;
  setTitle('搜索：' + q);

  const results = searchItems(q);
  const list = results.length
    ? results.map(itemCard).join('')
    : `<p class="lead">没有找到和“${q}”相关的内容。</p>`;

  $app.innerHTML = `
    <a class="back" href="#/">← 返回首页</a>
    <header class="page-head">
      <h1>搜索：${q}</h1>
      <p class="lead">找到 ${results.length} 条结果</p>
    </header>
    <div class="list">${list}</div>
  `;
}

$search.addEventListener('input', e => {
  const q = e.target.value;
  if (q.trim()) {
    renderSearch(q);
  } else if (searching) {
    searching = false;
    router();
  }
});

/* ==========================================================
   路由
   #/                 → 首页
   #/e/入口id         → 入口页
   #/p/内容slug       → 详情页
   ========================================================== */

function router() {
  $search.value = '';
  searching = false;

  const path = location.hash.replace(/^#/, '') || '/';
  const parts = path.split('/').filter(Boolean);
  let activeEntry = null;

  if (parts.length === 0) {
    renderHome();
  } else if (parts[0] === 'e' && parts[1]) {
    activeEntry = parts[1];
    renderEntry(parts[1]);
  } else if (parts[0] === 'p' && parts[1]) {
    const it = items.find(x => x.slug === parts[1]);
    activeEntry = it ? it.entry : null;
    renderDetail(parts[1]);
  } else {
    renderNotFound();
  }

  renderNav(activeEntry);

  window.scrollTo(0, 0);
  $app.classList.remove('fade-in');
  void $app.offsetWidth;
  $app.classList.add('fade-in');
}

/* 启动 */
document.getElementById('year').textContent = new Date().getFullYear();
window.addEventListener('hashchange', router);
router();
</script>
</body>
